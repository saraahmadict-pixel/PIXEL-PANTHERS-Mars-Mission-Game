<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control: Mars 2035 | Pixel Panthers</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eaf2ff;background:#070d20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 10%,#1a315c 0,transparent 40%),radial-gradient(ellipse at 5% 90%,#38204c 0,transparent 45%),#070d20;min-height:100vh}.stars{position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(1px 1px at 10% 12%,white 98%,transparent),radial-gradient(2px 2px at 32% 65%,white 98%,transparent),radial-gradient(1px 1px at 73% 22%,white 98%,transparent),radial-gradient(1px 1px at 88% 80%,white 98%,transparent);background-size:230px 170px}.wrap{position:relative;max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{letter-spacing:3px;color:#65d8ff;font-size:12px;font-weight:800}.tag{font-size:12px;color:#a6b7d5;border:1px solid #344565;border-radius:50px;padding:8px 12px}h1{font-size:clamp(35px,6vw,65px);line-height:1.03;margin:20px 0 8px}h1 span{color:#ff9869}h2{margin:0 0 12px;font-size:28px}p{color:#b8c8e4;line-height:1.6}.panel{border:1px solid #344666;background:linear-gradient(145deg,rgba(23,38,69,.93),rgba(11,20,42,.96));border-radius:20px;padding:25px;box-shadow:0 18px 60px #0005;margin-top:22px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:25px;align-items:center}.mars{width:min(300px,65vw);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle at 30% 25%,#f9ae70 0,#d96848 29%,#a33f39 58%,#522339 80%);box-shadow:inset -35px -25px 60px #260f28,0 0 70px #ef70433c;position:relative;overflow:hidden}.mars:before{content:"";position:absolute;inset:10% 15%;border-radius:50%;background:repeating-linear-gradient(155deg,transparent 0 22px,#75333a55 25px 35px,transparent 42px 65px);transform:rotate(-18deg)}button{cursor:pointer;border:0;border-radius:11px;padding:13px 20px;background:linear-gradient(120deg,#45d6ff,#4f8cff);font-weight:800;color:#07142b;font-size:15px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.35;cursor:not-allowed}button.secondary{background:#263957;color:#e9f3ff;border:1px solid #49607f}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.choice{background:#111e37;border:2px solid #30435f;border-radius:14px;padding:16px;cursor:pointer;transition:.15s;min-height:148px}.choice:hover{border-color:#68c8ff}.choice.selected{border-color:#5de6b7;background:#163b48}.choice h3{margin:6px 0;color:#fff}.choice small{color:#9fb3d0}.choice .emoji{font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#101c34;border:1px solid #30415e;border-radius:12px;padding:14px}.stat b{display:block;font-size:23px;margin-top:5px}.stat small{color:#8fa8cc}.section{margin-top:20px}.meter{height:10px;background:#293c59;border-radius:50px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#39cfbb,#6bd7ff);width:50%;transition:.3s}.notice{background:#172c40;border-left:4px solid #67d9fc;padding:13px;border-radius:8px;color:#c9d9ed;margin-top:12px}.warning{border-color:#ffad63;background:#352a30}.danger{border-color:#ff6666;background:#44212e}.good{border-color:#63e2b4;background:#163c37}.timeline{display:flex;gap:6px;margin:18px 0}.timeline div{height:6px;flex:1;border-radius:10px;background:#30425e}.timeline div.done{background:#5ddcb8}.option-row{display:flex;flex-wrap:wrap;gap:12px;margin:15px 0}.option-row .choice{flex:1;min-width:200px}.event{font-size:48px;text-align:center;margin:15px}.bigscore{font-size:65px;color:#65e3b9;font-weight:900}.foot{margin:30px 0;text-align:center;color:#8496b5;font-size:12px}input[type=range]{width:100%;accent-color:#63d9f8}a{color:#8bddff}ul{color:#bfd0e8;line-height:1.7}@media(max-width:750px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}.panel{padding:17px}}
</style></head><body><div class="stars"></div><main class="wrap"><header><div class="brand">◈ PIXEL PANTHERS <span style="color:#8da4c9">/ SPACE APPS CONCEPT</span></div><div class="tag">EDUCATIONAL MISSION SIMULATOR · v1.0</div></header><div id="app"></div><footer class="foot">Mission Control: Mars 2035 · An educational prototype. Game values are simplified, illustrative and not actual NASA mission specifications. · <a href="https://science.nasa.gov/mars/" target="_blank" rel="noopener">Explore NASA Mars Science</a></footer></main><script>
const app=document.getElementById('app');let s={page:0,rocket:null,objective:null,science:null,fuel:60,budget:1000,score:0,events:[],step:0,choices:[],result:null};
const rockets=[{id:'swift',icon:'🚀',name:'Swift Explorer',cost:260,capacity:2,reliability:76,desc:'Affordable launch, limited payload.'},{id:'atlas',icon:'🛰️',name:'Atlas Pathfinder',cost:390,capacity:3,reliability:88,desc:'Balanced mass capacity and reliability.'},{id:'titan',icon:'🌌',name:'Titan Heavy',cost:550,capacity:5,reliability:95,desc:'High payload, premium launch cost.'}];
const objectives=[{id:'water',icon:'💧',name:'Search for Water',desc:'Study possible water-related geology.',points:25},{id:'climate',icon:'🌪️',name:'Study Martian Climate',desc:'Observe dust and atmospheric changes.',points:25},{id:'life',icon:'🧬',name:'Search for Biosignatures',desc:'Study potentially habitable environments.',points:25}];
const tools=[{id:'camera',icon:'📷',name:'Imaging Camera',cost:90,mass:1,desc:'Maps surface features.',fits:['water','climate','life']},{id:'spectrometer',icon:'🔬',name:'Spectrometer',cost:160,mass:2,desc:'Analyzes minerals and chemical signatures.',fits:['water','life']},{id:'weather',icon:'🌡️',name:'Weather Station',cost:110,mass:1,desc:'Measures temperature and pressure.',fits:['climate']},{id:'drill',icon:'🪨',name:'Sample Drill',cost:220,mass:3,desc:'Samples subsurface materials.',fits:['water','life']}];
const eventBank=[{icon:'☄️',title:'Micrometeoroid Warning',description:'A small debris field appears ahead. What will mission control do?',options:[{label:'Adjust trajectory using reserve fuel',fuel:-12,score:18,feedback:'Smart: the spacecraft avoids the debris, but uses extra fuel.'},{label:'Continue without changing course',fuel:0,score:-12,feedback:'Risky: possible damage reduces mission safety.'}]},{icon:'🌞',title:'Solar Power Shortage',description:'Dust and spacecraft orientation reduce incoming sunlight.',options:[{label:'Switch off non-essential systems',fuel:0,score:18,feedback:'Good energy management protects vital systems.'},{label:'Keep all systems running',fuel:0,score:-12,feedback:'Battery reserves are depleted faster than expected.'}]},{icon:'🪐',title:'Mars Orbit Insertion',description:'The spacecraft must slow down to enter a stable Mars orbit.',options:[{label:'Perform planned braking burn',fuel:-18,score:25,feedback:'Correct: braking reduces orbital energy and enables capture.'},{label:'Skip the braking burn',fuel:0,score:-30,feedback:'Without sufficient braking, the spacecraft may fly past Mars.'}]},{icon:'🌪️',title:'Dust Storm at Landing Site',description:'A dust storm is approaching the planned landing zone.',options:[{label:'Delay landing and assess conditions',fuel:-8,score:20,feedback:'Good risk management: waiting improves situational awareness.'},{label:'Land immediately despite the storm',fuel:0,score:-18,feedback:'High-risk landing conditions reduce mission confidence.'}]}];
const money=n=>Math.max(0,n);const rocket=()=>rockets.find(x=>x.id===s.rocket);const instrument=()=>tools.find(x=>x.id===s.science);const objective=()=>objectives.find(x=>x.id===s.objective);const spent=()=> (rocket()?.cost||0)+(instrument()?.cost||0)+Math.round(s.fuel*2.4);const remaining=()=>s.budget-spent();const canLaunch=()=>s.rocket&&s.science&&s.objective&&remaining()>=0&&instrument().mass<=rocket().capacity&&s.fuel>=45;
function layout(title,body,buttons=''){app.innerHTML=`<div class="panel"><div class="timeline">${Array.from({length:6},(_,i)=>`<div class="${i<=s.page?'done':''}"></div>`).join('')}</div><h2>${title}</h2>${body}<div class="actions">${buttons}</div></div>`}
function go(p){s.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function select(k,v){s[k]=v;render()}function render(){if(s.page===0){app.innerHTML=`<div class="panel hero"><div><div class="brand">YOUR MISSION BEGINS NOW</div><h1>MISSION CONTROL<br><span>MARS 2035</span></h1><p>Become a mission architect. Choose your scientific goal, design a spacecraft, manage limited resources, and survive the journey to Mars.</p><div class="notice">Every decision changes your mission outcome. Can you balance science, safety and budget?</div><div class="actions"><button onclick="go(1)">START MISSION →</button><button class="secondary" onclick="document.getElementById('rules').classList.toggle('hidden')">HOW TO PLAY</button></div><div id="rules" class="notice hidden">1. Select a science goal. 2. Pick a rocket and instrument. 3. Set fuel within budget. 4. Respond to space events. 5. Review your score and improve.</div></div><div class="mars" role="img" aria-label="Illustrated Mars planet"></div></div>`;return}
if(s.page===1){layout('01 / Define Your Science Mission',`<p>Real space missions begin with a clear scientific question. Choose the purpose of your mission.</p><div class="grid">${objectives.map(o=>`<div class="choice ${s.objective===o.id?'selected':''}" onclick="select('objective','${o.id}')"><div class="emoji">${o.icon}</div><h3>${o.name}</h3><small>${o.desc}</small></div>`).join('')}</div><div class="notice">Science objective determines which instruments are most useful.</div>`,`<button class="secondary" onclick="go(0)">← Back</button><button ${!s.objective?'disabled':''} onclick="go(2)">CHOOSE SPACECRAFT →</button>`);return}
if(s.page===2){layout('02 / Choose Your Spacecraft',`<p>Compare launch cost, payload capacity and reliability. A more powerful rocket costs more.</p><div class="grid">${rockets.map(r=>`<div class="choice ${s.rocket===r.id?'selected':''}" onclick="select('rocket','${r.id}')"><div class="emoji">${r.icon}</div><h3>${r.name}</h3><small>${r.desc}</small><p><b>${r.cost} credits</b><br>Payload: ${r.capacity} units<br>Reliability: ${r.reliability}%</p></div>`).join('')}</div>`,`<button class="secondary" onclick="go(1)">← Back</button><button ${!s.rocket?'disabled':''} onclick="go(3)">SELECT INSTRUMENT →</button>`);return}
if(s.page===3){layout('03 / Choose a Scientific Instrument',`<p>Select one instrument to collect mission data. Match your tool to the science objective and rocket payload capacity.</p><div class="grid">${tools.map(t=>`<div class="choice ${s.science===t.id?'selected':''}" onclick="select('science','${t.id}')"><div class="emoji">${t.icon}</div><h3>${t.name}</h3><small>${t.desc}</small><p><b>${t.cost} credits</b><br>Mass: ${t.mass} units<br>${t.fits.includes(s.objective)?'✓ Relevant to your mission':'△ Less relevant to your mission'}</p></div>`).join('')}</div>${s.science&&s.rocket&&instrument().mass>rocket().capacity?'<div class="notice danger">Payload too heavy for this rocket. Choose a lighter instrument or return to spacecraft selection.</div>':''}`,`<button class="secondary" onclick="go(2)">← Back</button><button ${!s.science?'disabled':''} onclick="go(4)">PLAN RESOURCES →</button>`);return}
if(s.page===4){layout('04 / Mission Resource Planner',`<p>Your total mission budget is <b>1000 credits</b>. Fuel costs 2.4 credits per unit. More fuel helps with unexpected events, but raises cost.</p><div class="stats"><div class="stat"><small>Launch vehicle</small><b>${rocket().cost}</b></div><div class="stat"><small>Instrument</small><b>${instrument().cost}</b></div><div class="stat"><small>Fuel cost</small><b>${Math.round(s.fuel*2.4)}</b></div><div class="stat"><small>Remaining budget</small><b style="color:${remaining()<0?'#ff7474':'#6ce0b4'}">${remaining()}</b></div></div><div class="section"><h3>Fuel allocation: <span id="fuelvalue">${s.fuel}</span> units</h3><input aria-label="Fuel allocation" type="range" min="30" max="100" step="5" value="${s.fuel}" oninput="s.fuel=Number(this.value);render()"><div class="meter"><i style="width:${s.fuel}%"></i></div></div><div class="notice ${canLaunch()?'good':'warning'}">${remaining()<0?'Over budget: reduce fuel or choose cheaper equipment.':instrument().mass>rocket().capacity?'Payload capacity exceeded: choose a different rocket or instrument.':s.fuel<45?'Fuel below minimum safe planning threshold (45 units).': 'Mission plan ready. You can launch!'}</div><p><small>Note: credits, fuel units, mass units and reliability are invented for gameplay, not real engineering values.</small></p>`,`<button class="secondary" onclick="go(3)">← Back</button><button ${!canLaunch()?'disabled':''} onclick="launch()">🚀 LAUNCH MISSION</button>`);return}
if(s.page===5){let ev=eventBank[s.step];if(!ev){finish();return}layout(`05 / Flight Event ${s.step+1} of ${eventBank.length}`,`<div class="stats"><div class="stat"><small>Fuel remaining</small><b>${s.fuel}</b></div><div class="stat"><small>Mission score</small><b>${s.score}</b></div><div class="stat"><small>Event</small><b>${s.step+1} / ${eventBank.length}</b></div><div class="stat"><small>Budget left</small><b>${remaining()}</b></div></div><div class="event">${ev.icon}</div><h3 style="text-align:center">${ev.title}</h3><p style="text-align:center">${ev.description}</p><div class="option-row">${ev.options.map((o,i)=>`<div class="choice" onclick="chooseEvent(${i})"><h3>${String.fromCharCode(65+i)}. ${o.label}</h3><small>Choose this action →</small></div>`).join('')}</div><div class="notice">Consider science, safety and fuel reserves before choosing.</div>`);return}
if(s.page===6){const r=s.result;layout('06 / Mission Debrief',`<div style="text-align:center"><div class="event">${r.success?'🏆':'🛰️'}</div><h2>${r.success?'MISSION ACCOMPLISHED':'MISSION NEEDS REDESIGN'}</h2><div class="bigscore">${r.score}<small style="font-size:22px;color:#a6c2dc"> / 100</small></div><p>${r.success?'Your design balanced resources and mission decisions.':'Review your decisions and redesign the mission for a stronger result.'}</p></div><div class="stats"><div class="stat"><small>Spacecraft</small><b style="font-size:15px">${rocket().name}</b></div><div class="stat"><small>Science tool</small><b style="font-size:15px">${instrument().name}</b></div><div class="stat"><small>Fuel left</small><b>${s.fuel}</b></div><div class="stat"><small>Budget left</small><b>${remaining()}</b></div></div><h3>Mission decision log</h3>${s.events.map(e=>`<div class="notice ${e.points>=0?'good':'warning'}"><b>${e.title}</b><br>${e.choice}<br><small>${e.feedback} (${e.points>=0?'+':''}${e.points} points)</small></div>`).join('')}<div class="notice">Scientific takeaway: Mission planning requires trade-offs between mass, energy, budget, reliability and scientific value. This is a simplified classroom model.</div>`,`<button onclick="restart()">↻ DESIGN A NEW MISSION</button><button class="secondary" onclick="window.print()">PRINT RESULTS</button>`);return}}
function launch(){if(!canLaunch())return;s.score=15+(instrument().fits.includes(s.objective)?20:0)+(remaining()>=150?10:0)+(rocket().reliability>=88?10:5);s.events=[];s.step=0;go(5)}function chooseEvent(i){const ev=eventBank[s.step],opt=ev.options[i];s.fuel+=opt.fuel;let pts=opt.score;if(s.fuel<0){pts-=20;s.fuel=0} s.score+=pts;s.events.push({title:ev.title,choice:opt.label,feedback:opt.feedback,points:pts});s.step++;if(s.step>=eventBank.length)finish();else render()}function finish(){let points=Math.max(0,Math.min(100,s.score+(s.fuel>=15?7:0)));s.result={score:points,success:points>=65&&s.fuel>=10};go(6)}function restart(){s={page:0,rocket:null,objective:null,science:null,fuel:60,budget:1000,score:0,events:[],step:0,choices:[],result:null};render()}render();
</script></body></html>
